<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragmentos/layout}"
      lang="pt-BR">
<head>
    <title>Material</title>
</head>
<body>
<div layout:fragment="conteudo">

    <div class="cabecalho-pagina">
        <div>
            <span class="eyebrow">Cadastros &middot; Materiais</span>
            <h1 th:text="${edicao} ? 'Editar material' : 'Novo material'">Material</h1>
        </div>
    </div>

    <div class="cartao">
        <form method="post"
              th:action="${edicao} ? @{/produtos/{id}(id=${produtoId})} : @{/produtos}"
              th:object="${produto}">

            <div class="campo">
                <label for="nome">Nome do material</label>
                <input type="text" id="nome" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
                <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="unidade">Unidade de medida</label>
                    <input type="text" id="unidade" th:field="*{unidade}"
                           placeholder="un, g, ml, par, tubete"
                           th:classappend="${#fields.hasErrors('unidade')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}"></span>
                </div>

                <div class="campo">
                    <label for="precoUnitario">Preco unitario (R$)</label>
                    <input type="number" step="0.01" min="0" id="precoUnitario"
                           th:field="*{precoUnitario}"
                           th:classappend="${#fields.hasErrors('precoUnitario')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('precoUnitario')}"
                          th:errors="*{precoUnitario}"></span>
                </div>

                <div class="campo">
                    <label for="estoque">Quantidade em estoque</label>
                    <input type="number" step="0.01" min="0" id="estoque"
                           th:field="*{estoque}"
                           th:classappend="${#fields.hasErrors('estoque')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span>
                </div>
            </div>

            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar material</button>
                <a th:href="@{/produtos}" class="botao secundario">Cancelar</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
