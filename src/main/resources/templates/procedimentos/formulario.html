<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragmentos/layout}"
      lang="pt-BR">
<head>
    <title>Procedimento</title>
</head>
<body>
<div layout:fragment="conteudo">

    <div class="cabecalho-pagina">
        <div>
            <span class="eyebrow">Cadastros &middot; Procedimentos</span>
            <h1 th:text="${edicao} ? 'Editar procedimento' : 'Novo procedimento'">Procedimento</h1>
        </div>
    </div>

    <div class="cartao">
        <form method="post"
              th:action="${edicao} ? @{/procedimentos/{id}(id=${procedimentoId})} : @{/procedimentos}"
              th:object="${procedimento}">

            <div class="campo">
                <label for="nome">Nome do procedimento</label>
                <input type="text" id="nome" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
                <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="campo">
                <label for="descricao">Descricao</label>
                <textarea id="descricao" th:field="*{descricao}"
                          placeholder="O que este procedimento envolve"></textarea>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="precoMaoObra">Honorarios do dentista (R$)</label>
                    <input type="number" step="0.01" min="0" id="precoMaoObra"
                           th:field="*{precoMaoObra}"
                           th:classappend="${#fields.hasErrors('precoMaoObra')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('precoMaoObra')}"
                          th:errors="*{precoMaoObra}"></span>
                </div>

                <div class="campo">
                    <label for="duracaoMinutos">Duracao (minutos)</label>
                    <input type="number" min="5" max="480" id="duracaoMinutos"
                           th:field="*{duracaoMinutos}"
                           th:classappend="${#fields.hasErrors('duracaoMinutos')} ? 'invalido'">
                    <span class="erro" th:if="${#fields.hasErrors('duracaoMinutos')}"
                          th:errors="*{duracaoMinutos}"></span>
                </div>
            </div>

            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar procedimento</button>
                <a th:href="@{/procedimentos}" class="botao secundario">Cancelar</a>
            </div>

        </form>

        <p class="cartao-nota" th:if="${!edicao}">
            Depois de salvar voce podera vincular os materiais consumidos.
        </p>
    </div>

</div>
</body>
</html>
